# Builds the Mac app (free, on GitHub's Mac machines). Download it from the run's "Artifacts".
name: Mac build
on:
  push:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      - run: npx electron-builder --mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac.zip
